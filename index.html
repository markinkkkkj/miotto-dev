<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>miotto.dev</title>
    <meta name="description" content="Hub do miotto.dev — portfólio e notas de Marcos Miotto.">
    <meta name="theme-color" content="#0e1210">

    <!-- Tipografia: Inter (leitura) + JetBrains Mono (labels) — mesma
         identidade visual dos demais subdomínios (marcos.miotto.dev, notes.miotto.dev). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="container">
      <p class="prompt"><span class="symbol">$</span> cd ~<span class="cursor" aria-hidden="true"></span></p>
      <h1>miotto<span>.dev</span></h1>
      <p class="intro">Ponto de partida. Escolhe pra onde ir:</p>

      <nav aria-label="Subdomínios">
        <div class="links">
          <a class="link-card" href="https://marcos.miotto.dev">
            <span class="meta">
              <strong>Portfólio</strong>
              <span>Projetos, stack e contato — quem eu sou como dev.</span>
            </span>
            <span class="domain">marcos.</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>

          <a class="link-card" href="https://notes.miotto.dev">
            <span class="meta">
              <strong>Notas</strong>
              <span>Apresentações e materiais, acessíveis de qualquer lugar.</span>
            </span>
            <span class="domain">notes.</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </nav>

      <footer>
        <p>Marcos Miotto · <a href="https://github.com/markinkkkkj" rel="noopener">github.com/markinkkkkj</a></p>
      </footer>
    </main>
  </body>
</html>
